[system]
; TODOS: global configs, eg update-check via proxy-server 

[paths]
; Directories where built plugins (.so/.dll) are located.
; The application expects plugins to follow naming conventions:
; - Data Plugins:   <topic>_<type>_input
; - Upload Plugins: <topic>_upload
data_plugins_dir = ./plugins/data
upload_plugins_dir = ./plugins/upload

[auth]
; Central SaaS authentication settings.
; These are typically used by Upload plugins for API handshakes.
saas_base_url = https://saas.example.com
saas_login = saas_user
saas_password = TopSecret123!
bearer_token = sample_token_12345

; SSL Verification settings (optional)
; If true (default), the SaaS server certificate is verified against CA bundles.
; Set to false to bypass verification (e.g., for self-signed certificates in dev).
verify_ssl = true
; Path to a custom CA bundle file (.pem) if needed.
; ssl_ca_path = ./certs/cacert.pem

[logging]
; Global logging configuration.
; Each topic will also have its own log file in this directory.
log_path = ./logs
log_level = debug

[gui]
; GUI behavior settings.
show_preview = true
; If true, only pre-configured data sources (data_*) are used. 
; Dialogs for path/connection string selection are skipped.
only_default_datasource = false

[topics]
; Topic definitions for validation and upload logic mapping.
; Plugins are discovered dynamically based on the topic name.

[topics.HR]
; Path to the JSON schema for local validation.
schema_path = ./data/hr_schema_v1.json
; Target SaaS endpoint for data transmission.
upload_endpoint = https://saas.example.com/api/employeeimport
; Optional: Proxy configuration (<username>:<password>@<proxy-server>:<port>)
; Value must be within double quotation marks
; proxy = "myuser:mypass@proxy.example.com:8080"
; Optional: Upload timeout in seconds (default: 60)
upload_timeout = 60

; Default data sources for various interfaces. 
; For 'csv' and 'json', a file dialog will open at these locations.
; For others, these strings will be pre-filled in a text entry dialog.
data_csv = "./data/hr_data.csv"
data_json = "./data/hr_data.json"
data_xlsx = "./data/hr_data.xlsx"
data_db-ora = "host:oraserver.example.com, port:1521, service_name:orcl, user:username, password:password"
data_db-pg = "host:pgserver.example.com, port:5432, database:dbname, user:username, password:password"
data_kafka = "bootstrap_servers:kafka.example.com, port:9092, topic:hr_topic, group_id:cgui_group"

; Optional: Topic-specific upload options (payload overrides).
; These keys will be merged into the "options" object of the upload payload.
[topics.HR.options]
updateExistingRecords = "true"
insertBaseTables = "false"
autoCreatePortalUser = "false"
; dateFormat is also configurable via GUI, but a value here acts as the initial default.
; It supports dd, mm, yyyy and any delimiter like . / -
dateFormat = "dd.mm.yyyy"

[topics.Health]
schema_path = ./data/health_schema_v1.json
upload_endpoint = https://saas.example.com/api/v1/health/upload
data_csv = "./data/health_extract.csv"

[topics.Health.options]
insertBaseTables = "true"
dateFormat = "yyyy-mm-dd"
data_db-sqlite = "./data/health_data.db"

[topics.Department]
schema_path = ./data/dept_schema_v1.json
upload_endpoint = https://saas.example.com/api/v1/dept/upload
data_json = "./data/department_hierarchy.json"
data_db-ora = "user/pass@oraserver:1521/dept_service"

[topics.Department.options]
updateExistingRecords = "false"
dateFormat = "mm/dd/yyyy"

[topics.Location]
schema_path = ./data/location_schema_v1.json
upload_endpoint = https://saas.example.com/api/v1/location/upload
data_mft-s3 = "s3://my-mft-bucket/location_data/"
