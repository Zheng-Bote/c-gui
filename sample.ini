[plugins]
; Paths to the compiled shared libraries
csv = /c-gui/plugins/csv_input.so
db = /c-gui/plugins/db_input.so
kafka = /c-gui/plugins/kafka_input.so

[auth]
saas_base_url = https://saas.example.com
saas_login = saas_user
saas_password = TopSecret123!
bearer_token = sample_token_12345

[logging]
log_path = ./logs
log_level = debug

[gui]
show_preview = true

[topics]
; Topic definitions for validation and upload
[topics.HR]
schema_path = /c-gui/data/hr_schema_v1.json
upload_endpoint = https://saas.example.com/api/employeeimport

[topics.Health]
schema_path = /c-gui/data/health_schema_v1.json
upload_endpoint = https://saas.example.com/api/v1/health/upload

[topics.Department]
schema_path = /c-gui/data/dept_schema_v1.json
upload_endpoint = https://saas.example.com/api/v1/dept/upload

[topics.Location]
schema_path = /c-gui/data/location_schema_v1.json
upload_endpoint = https://saas.example.com/api/v1/location/upload